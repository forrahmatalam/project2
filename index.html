<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=main, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <script src="script.js"></script>
  </head>
  <body>
    <main>
      <section id="section1">
        <header>
          <div>
            <h1><i class="ri-menu-4-fill"></i> Bright</h1>
          </div>

          <div class="search-div">
            <input type="text" placeholder="Search..." />
            <i class="ri-search-line"></i>
          </div>

          <div class="icons">
            <i class="ri-notification-3-line"></i>
            <i class="ri-user-3-line"></i>
          </div>
        </header>

        <div class="hero-div">
          <div class="hero-text">
            <h2>
              Enjoy free home delivery <br />
              in this summer
            </h2>
            <p>Designer Dresses - Pick your favorite</p>
            <button>Shop Now</button>

            <div class="arrow">
              <i class="ri-arrow-left-wide-line"></i>
              <i class="ri-arrow-right-wide-line"></i>
            </div>
          </div>
        </div>

        <div class="bottom-left">

          <div class="top-text">
         <p>Start from $45.30</p>
         <i class="ri-heart-line"></i>
        </div>

          <h3>Mens Shoes</h3>
        </div>


   <div class="bottom-center">

          <div class="top-text">
         <p>Start from $105.00</p>
         <i class="ri-heart-line"></i>
        </div>
        
          <h3>Cycle Accessories</h3>
        </div>


        <div class="bottom-right">

          <div class="top-text">
         <p>Start from $34.00</p>
         <i class="ri-heart-line"></i>
        </div>
        
          <h3>Home Accessories</h3>
        </div>


      </section>
    </main>
  </body>
</html>
